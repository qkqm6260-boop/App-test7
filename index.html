
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sheriff Robot View</title>

<style>
body {
    margin: 0;
    background: #101820;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

h2 {
    color: #00e5ff;
}

#container {
    position: relative;
    width: 95%;
    max-width: 900px;
    margin: auto;
}

video {
    width: 100%;
    display: block;
    transform: scaleX(-1);
}

canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    transform: scaleX(-1);
}

#status {
    font-size: 20px;
    margin: 15px;
    color: #00ff88;
}

#coords {
    font-size: 20px;
    margin: 15px;
    color: #00e5ff;
}

#help {
    color: #bbbbbb;
    font-size: 13px;
}
</style>
</head>

<body>

<h2>SHERIFF ROBOT VIEW</h2>

<div id="container">
    <video id="video" autoplay muted playsinline></video>
    <canvas id="canvas"></canvas>
</div>

<div id="status">카메라 연결 중...</div>
<div id="coords">X: -- | Y: -- | Z: --</div>
<div id="help">얼굴 검출 및 XYZ 위치 추정 시스템</div>

<script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>

<script>
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const statusText = document.getElementById("status");
const coordsText = document.getElementById("coords");

const FACE_WIDTH_CM = 16;
const FOCAL_LENGTH_PX = 600;
const WARN_RATIO = 0.35;

let running = false;

async function startCamera() {
    try {
        statusText.textContent = "얼굴 검출 모델 로딩 중...";

        // 얼굴 검출 모델 다운로드
        const MODEL_URL =
            "https://cdn.jsdelivr.net/gh/vladmandic/face-api@latest/model/";

        await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);

        // 카메라 자동 실행
        const stream = await navigator.mediaDevices.getUserMedia({
            video: true,
            audio: false
        });

        video.srcObject = stream;

        await new Promise(resolve => {
            video.onloadedmetadata = resolve;
        });

        await video.play();

        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;

        running = true;
        statusText.textContent = "TARGET LOCKED SYSTEM READY";

        detectFaces();

    } catch (error) {
        console.error(error);
        statusText.textContent =
            "실행 오류: 카메라 권한 또는 인터넷 연결을 확인하세요.";
    }
}

async function detectFaces() {
    if (!running) return;

    try {
        const W = canvas.width;
        const H = canvas.height;

        const faces = await faceapi.detectAllFaces(
            video,
            new faceapi.TinyFaceDetectorOptions({
                inputSize: 320,
                scoreThreshold: 0.5
            })
        );

        ctx.clearRect(0, 0, W, H);

        const centerX = W / 2;
        const centerY = H / 2;

        // 화면 중앙 십자선
        ctx.strokeStyle = "yellow";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(centerX - 20, centerY);
        ctx.lineTo(centerX + 20, centerY);
        ctx.moveTo(centerX, centerY - 20);
        ctx.lineTo(centerX, centerY + 20);
        ctx.stroke();

        if (faces.length === 0) {
            statusText.textContent = "얼굴을 찾는 중...";
            statusText.style.color = "#00e5ff";
            coordsText.textContent = "X: -- | Y: -- | Z: --";
        }

        for (const face of faces) {
            const { x, y, width, height } = face.box;

            const cx = x + width / 2;
            const cy = y + height / 2;

            // 얼굴 크기로부터 거리 추정
            const Z = FACE_WIDTH_CM * FOCAL_LENGTH_PX / width;

            // 화면 중심 기준 상대 좌표
            const X = (cx - centerX) * Z / FOCAL_LENGTH_PX;
            const Y = (centerY - cy) * Z / FOCAL_LENGTH_PX;

            const warning = width / W > WARN_RATIO;
            const color = warning ? "#ff3030" : "#00ff88";

            // 얼굴 테두리
            ctx.strokeStyle = color;
            ctx.lineWidth = 3;
            ctx.strokeRect(x, y, width, height);

            // 얼굴 중심 십자선
            ctx.beginPath();
            ctx.moveTo(cx - 15, cy);
            ctx.lineTo(cx + 15, cy);
            ctx.moveTo(cx, cy - 15);
            ctx.lineTo(cx, cy + 15);
            ctx.stroke();

            // 상태 텍스트
            ctx.font = "bold 18px Arial";
            ctx.fillStyle = color;

            const label = warning
                ? "WARNING! TOO CLOSE!"
                : "TARGET LOCKED";

            ctx.fillText(label, x, Math.max(24, y - 8));

            // XYZ 좌표
            coordsText.textContent =
                `X: ${X.toFixed(1)} cm | ` +
                `Y: ${Y.toFixed(1)} cm | ` +
                `Z: ${Z.toFixed(1)} cm`;

            statusText.textContent = warning
                ? "WARNING! TOO CLOSE!"
                : "TARGET LOCKED";

            statusText.style.color = color;
        }
    } catch (error) {
        console.error(error);
    }

    if (running) {
        requestAnimationFrame(detectFaces);
    }
}

// 페이지를 열면 자동으로 카메라 실행
window.addEventListener("load", startCamera);
</script>

</body>
</html>
